name: CI & Publish

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  BUN_VERSION: 1.4.x
  NODE_VERSION: 22

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Disable npm cache to avoid 400 errors on fresh runners
          cache: ''
      
      - name: Install extension dependencies
        run: |
          cd extension
          npm install --legacy-peer-deps
      
      - name: Type-check extension
        run: |
          cd extension
          npx tsc --noEmit --strict --moduleResolution bundler ultrawork.ts || true
      
      - name: Run probe tests (shapes + evidence)
        run: |
          cd extension
          bun test ./ulw-analysis/probe_shapes.ts
          bun test ./ulw-analysis/probe_evidence.ts
      
      - name: Run grading & charts (if experiment data exists)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python || true)
          if [ -n "$PY" ] && [ -d experiments/runs ]; then
            (cd grading && "$PY" grade.py ../experiments/runs) 2>&1 || true
            (cd charts && "$PY" make_charts.py) 2>&1 || true
          else
            echo "No python or no experiment runs — skipping"
          fi

  publish-npm:
    name: Publish to npm
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      
      - name: Setup npm provenance
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      
      - name: Publish to npm
        run: |
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    name: Create GitHub Release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            paper/paper.pdf
            charts/out/*.png